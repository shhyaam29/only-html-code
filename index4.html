<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
</head>
<body>
<table border="1" align="center" width="450" bgcolor="black" cellpadding="8">
    <tr bgcolor="orange">
        <td colspan="2">
            <font color="yellow" size="4">Sign Up</font>
        </td>
    </tr>
    <tr>
        <td align="right"><font color="yellow">First Name</font></td>
        <td><input type="text" placeholder="Enter First Name"></td>
    </tr>
    <tr>
        <td align="right"><font color="yellow">Last Name</font></td>
        <td><input type="text" placeholder="Enter Last Name"></td>
    </tr>
    <tr>
        <td align="right"><font color="yellow">Date of Birth</font></td>
        <td>
            <select><option>Date</option></select>
            <select><option>Month</option></select>
            <select><option>Year</option></select>
        </td>
    </tr>
    <tr>
        <td align="right"><font color="yellow">Gender</font></td>
        <td>
            <input type="radio" name="gender"> <font color="white">Male</font>
            <input type="radio" name="gender"> <font color="white">Female</font>
        </td>
    </tr>
    <tr>
        <td align="right"><font color="yelloe">Country</font></td>
        <td>
            <select><option>Country</option></select>
        </td>
    </tr>
    <tr>
        <td align="right"><font color="yellow">E-mail</font></td>
        <td><input type="email" placeholder="Enter E-mail"></td>
    </tr>
    <tr>
        <td align="right"><font color="yellow">Phone</font></td>
        <td><input type="text" placeholder="Enter Phone"></td>
    </tr>
    <tr>
        <td align="right"><font color="yellow">Password</font></td>
        <td><input type="password"></td>
    </tr>
    <tr>
        <td align="right"><font color="yellow">Confirm Password</font></td>
        <td><input type="password"></td>
    </tr>
    <tr>
        <td colspan="2" align="center">
            <input type="checkbox"> 
            <font color="yellow">I Agree to the Terms of use</font>
        </td>
    </tr>
    <tr bgcolor="orange">
        <td colspan="2" align="right">
            <input type="submit" value="Submit">
            <input type="reset" value="Cancel">
        </td>
    </tr>
</table>
</body>
</html>
