<html>
<head>
<title>Client Intake Form</title>
</head>
<body bgcolor="purple">
<h2 align="center"><font color="white">Spa Client Intake Form</font></h2>
<br>
<table align="center" width="80%">
<tr>
<td><font color="pink">Client Details</font></td>
<td><font color="white">Emergency Contact Details</font></td>
<td><font color="white">Services & Checkout</font></td>
</tr>
</table>
<br><br>
<form>
<table align="center" width="75%" cellpadding="5">
<tr>
<td colspan="2"><font color="white">Name</font></td>
</tr>
<tr>
<td><input type="text" placeholder="First Name"></td>
<td><input type="text" placeholder="Last Name"></td>
</tr>
<tr>
<td colspan="2"><br><font color="white">Phone</font></td>
</tr>
<tr>
<td colspan="2"><input type="tel" size="60"></td>
</tr>
<tr>
<td colspan="2"><br><font color="white">Email</font></td>
</tr>
<tr>
<td colspan="2"><input type="email" size="60"></td>
</tr>
<tr>
<td colspan="2"><br><font color="white">Address</font></td>
</tr>
<tr>
<td colspan="2"><input type="text" size="60" placeholder="Street Address"></td>
</tr>
<tr>
<td colspan="2"><input type="text" size="60" placeholder="Address Line 2"></td>
</tr>
<tr>
<td><input type="text" placeholder="City"></td>
<td><input type="text" placeholder="State/Region"></td>
</tr>
<tr>
<td><input type="text" placeholder="Postal Code"></td>
<td>
<select>
<option>Country</option>
<option>india</option>
<option>japan</option>
<option>usa</option>
</select>
</td>
</tr>
<tr>
<td colspan="2" align="center">
<br><br>
<input type="button" value="Next">
</td>
</tr>
</table>
</form>
</body>
</html>
